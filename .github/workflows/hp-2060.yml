# hp-2060: strata-poly only, Linux x64, CUDA 13.0, sm_75 + sm_86 (RTX 2060 and RTX 3060), for A/B tests on one PC.
# Same toolchain family as the release's Linux package (Ubuntu 22.04, gcc 12, CUDA 13.0) and the same
# configure flags as tools/packaging/build_cuda_linux.sh.
name: hp-2060

on:
  push:
    branches: [hp-2060, hp-2060-extra, hp-2060-k, hp-2060-l, hp-3060]
  workflow_dispatch:

concurrency:
  group: hp-2060-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the engine with the release's flags (tests off: no ggml); the tests in a tree of their own (ggml as their oracle)
          - { kind: engine, tests: 'OFF', targets: 'strata-poly' }
          - { kind: tests, tests: 'ON', targets: 'poly_mmq_paths_test poly_inkling2_test poly_i8m_shapes_test poly_slots_lanes_test poly_gemm_small_test poly_nvfp4_lanes_test poly_cpu_x4_test poly_ngram_lookup_test poly_iq3_lanes_test poly_iq_slot_lanes_test' }
    name: ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: nvidia/cuda:13.0.2-devel-ubuntu22.04
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates ninja-build ccache gcc-12 g++-12 python3-pip file binutils
          python3 -m pip install --no-cache-dir 'cmake==3.31.6'
          cmake --version | head -1
          nvcc --version | tail -2
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-hp2060-sm75-${{ matrix.kind }}-${{ github.sha }}
          restore-keys: ccache-hp2060-sm75-${{ matrix.kind }}-
      - name: Configure
        run: |
          cmake -G Ninja -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_CUDA_HOST_COMPILER=g++-12 \
            -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=${{ matrix.tests }} -DSTRATA_EXPERIMENTAL_SM60=OFF \
            -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_PORTABLE=ON -DSTRATA_Q6K_EXPERTS=ON \
            "-DCMAKE_CUDA_ARCHITECTURES=75-real;86-real" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
      - name: Build ${{ matrix.targets }}
        run: |
          ccache -z
          cmake --build build --target ${{ matrix.targets }} -j "$(nproc)"
          ccache -s | head -12
      - name: CPU tests (no card needed)
        if: matrix.kind == 'tests'
        run: |
          grep -m1 -o -w 'avx512f\|avx2' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          ./build/poly_cpu_x4_test
          ./build/poly_ngram_lookup_test
      - name: Stage tests
        if: matrix.kind == 'tests'
        run: |
          mkdir -p out
          cp build/poly_mmq_paths_test build/poly_inkling2_test build/poly_i8m_shapes_test build/poly_slots_lanes_test build/poly_gemm_small_test build/poly_nvfp4_lanes_test build/poly_cpu_x4_test out/
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'tests'
        with:
          name: strata-poly-sm75-tests
          path: out
          retention-days: 14
      - name: Spill audit (sm_75)
        if: matrix.kind == 'engine'
        run: |
          # every kernel of the binary as built for sm_75: registers, stack frame (spills and local arrays), .local
          mkdir -p audit
          python3 tools/check_cuda_spills.py --list --cuobjdump /usr/local/cuda/bin/cuobjdump build/strata-poly \
            > audit/resource-usage.csv
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("audit/resource-usage.csv")))
          bad = [r for r in rows if int(r["stack"]) > 0 or int(r["local"]) > 0 or int(r["reg"]) >= 255]
          bad.sort(key=lambda r: (-int(r["stack"]), r["kernel"]))
          with open("audit/spills.txt", "w") as f:
              f.write("%d of %d sm_75 kernel instances with STACK > 0, LOCAL > 0 or REG >= 255\n" % (len(bad), len(rows)))
              f.write("%5s %6s %6s  %s\n" % ("REG", "STACK", "LOCAL", "kernel"))
              for r in bad:
                  f.write("%5s %6s %6s  %s\n" % (r["reg"], r["stack"], r["local"], r["kernel"]))
          PY
          cat audit/spills.txt
          # the local-memory instructions in each kernel's sm_75 SASS (LDL / STL: spills, local arrays, a parameter
          # struct indexed by a register), the kernels with any, most first
          /usr/local/cuda/bin/cuobjdump -sass build/strata-poly > audit/sass.txt
          python3 - <<'PY'
          import re, subprocess
          counts, cur = {}, None
          for line in open("audit/sass.txt"):
              m = re.match(r"\s*Function : (\S+)", line)
              if m:
                  cur = m.group(1); counts.setdefault(cur, [0, 0]); continue
              if cur and re.search(r"\bLDL\b|\bLDL\.", line): counts[cur][0] += 1
              if cur and re.search(r"\bSTL\b|\bSTL\.", line): counts[cur][1] += 1
          bad = sorted(((l + s, l, s, f) for f, (l, s) in counts.items() if l + s), reverse=True)
          names = subprocess.run(["c++filt"], input="\n".join(f for *_, f in bad) + "\n", capture_output=True, text=True).stdout.splitlines()
          with open("audit/local_ops.txt", "w") as o:
              o.write("%d of %d sm_75 kernels with LDL/STL in their SASS\n%5s %5s  %s\n" % (len(bad), len(counts), "LDL", "STL", "kernel"))
              for (t, l, s, f), n in zip(bad, names):
                  o.write("%5d %5d  %s\n" % (l, s, n))
          PY
          rm audit/sass.txt
          head -60 audit/local_ops.txt
          python3 tools/check_cuda_spills.py --cuobjdump /usr/local/cuda/bin/cuobjdump build/strata-poly \
            > audit/guard.txt 2>&1 || true
          tail -5 audit/guard.txt
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'engine'
        with:
          name: strata-poly-sm75-spill-audit
          path: audit
          retention-days: 14
      - name: Stage
        if: matrix.kind == 'engine'
        run: |
          set -eu
          mkdir -p out/lib
          cp build/strata-poly out/
          for so in libcudart.so.13 libcublas.so.13 libcublasLt.so.13; do
            cp -L /usr/local/cuda/lib64/$so out/lib/ 2>/dev/null || cp -L "$(find /usr/local/cuda/ -name "$so" | head -1)" out/lib/
          done
          nv=$(nvcc --version | sed -n 's/.*release \([0-9.]*\).*/\1/p')
          printf '{"branch":"%s","commit":"%s","cuda":"%s","archs":"75-real;86-real","host":"ubuntu22.04 gcc-12"}\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$nv" > out/BUILD.json
          cat > out/run.sh <<'SH'
          #!/bin/sh
          # runs strata-poly with the CUDA 13 libraries shipped next to it
          d=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd -P)
          LD_LIBRARY_PATH="$d/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$d/strata-poly" "$@"
          SH
          sed -i 's/^          //' out/run.sh
          chmod +x out/run.sh out/strata-poly
          file out/strata-poly; readelf -d out/strata-poly | grep NEEDED; ls -la out out/lib
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'engine'
        with:
          name: strata-poly-sm75
          path: |
            out/strata-poly
            out/run.sh
            out/BUILD.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'engine'
        with:
          name: strata-poly-sm75-cuda13-libs
          path: out/lib
          retention-days: 14
